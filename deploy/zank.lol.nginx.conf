# DNS for zank.lol may still be propagating - install via certbot once `dig zank.lol` resolves to this VPS.
server {
    server_name zank.lol;

    location / {
        proxy_pass         http://localhost:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zank.lol/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zank.lol/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = zank.lol) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name zank.lol;
    return 404; # managed by Certbot
}
